name: Unit Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-unit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Durably.CI.slnf

      - name: Build
        run: dotnet build Durably.CI.slnf -c Release --no-restore -p:SkipAngularBuild=true

      - name: Test
        run: |
          dotnet test tests/Durably.Core.UnitTests/Durably.Core.UnitTests.csproj \
            -c Release --no-build --verbosity normal \
            --logger "trx;LogFileName=core-unit.trx" \
            --results-directory TestResults
          dotnet test tests/Durably.Extensions.DependencyInjection.UnitTests/Durably.Extensions.DependencyInjection.UnitTests.csproj \
            -c Release --no-build --verbosity normal \
            --logger "trx;LogFileName=di-unit.trx" \
            --results-directory TestResults
          dotnet test tests/Durably.Persistence.EntityFrameworkCore.UnitTests/Durably.Persistence.EntityFrameworkCore.UnitTests.csproj \
            -c Release --no-build --verbosity normal \
            --logger "trx;LogFileName=ef-unit.trx" \
            --results-directory TestResults
          dotnet test tests/Durably.Traceability.UnitTests/Durably.Traceability.UnitTests.csproj \
            -c Release --no-build --verbosity normal \
            --logger "trx;LogFileName=traceability-unit.trx" \
            --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults
          if-no-files-found: ignore
